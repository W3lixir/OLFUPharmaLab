    <style>
        .date-and-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .date-and-actions label { font-size: 14px; font-weight: 600; color: #4a5568; }
        .date-and-actions input[type=date] { padding: 10px 14px; border: 2px solid var(--lab-border); border-radius: var(--lab-radius); font-size: 15px; }
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; }
        .room-box { aspect-ratio: 1; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; border: 2px solid #cbd5e0; font-weight: 600; font-size: 18px; color: #2d3748; font-family: inherit; }
        .room-box.available { background: #e2e8f0; color: #4a5568; border-color: #cbd5e0; }
        .room-box.available:hover { background: #cbd5e0; border-color: #a0aec0; }
        .room-box.occupied { background: #38a169; color: white; border-color: #2f855a; }
        .room-box.occupied:hover { filter: brightness(1.1); border-color: #276749; }
        .room-box .room-label { font-size: 14px; margin-top: 8px; opacity: 0.9; font-weight: 600; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .rooms-modal { background: white; border-radius: 16px; max-width: 520px; width: 100%; max-height: 90vh; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .rooms-modal .modal-header { padding: 20px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .rooms-modal .modal-title { font-size: 20px; font-weight: 700; color: #1a202c; }
        .rooms-modal .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #718096; padding: 0 8px; line-height: 1; }
        .rooms-modal .modal-close:hover { color: #2d3748; }
        .rooms-modal .modal-body { padding: 24px; overflow-y: auto; max-height: 60vh; }
        .rooms-modal .modal-footer { padding: 16px 24px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 8px; }
        .detail-row { margin-bottom: 16px; }
        .detail-label { font-size: 12px; color: #718096; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
        .detail-value { font-size: 15px; color: #2d3748; }
        .schedule-card { background: #f7fafc; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #38a169; }
        .schedule-card .detail-row { margin-bottom: 8px; }
        .schedule-card .detail-row:last-child { margin-bottom: 0; }
        .empty-msg { text-align: center; color: #718096; padding: 24px; font-size: 15px; }
        .btn { padding: 10px 20px; border-radius: var(--lab-radius); font-weight: 600; font-size: 14px; cursor: pointer; border: none; }
        .btn-secondary { background: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background: #e2e8f0; }
    </style>
</head>

    <script src="js/nav-highlighting.js"></script>
    <script>
    (function() {
        var ROOM_TYPE = 'lecture';
        var roomNames = ['AMS 204', 'AMS 205', 'AMS 301', 'AMS 302', 'AMS 303'];

        var viewDateEl = document.getElementById('view-date');
        var roomsGrid = document.getElementById('rooms-grid');
        var modalDetails = document.getElementById('modal-details');
        var modalDetailsTitle = document.getElementById('modal-details-title');
        var modalDetailsBody = document.getElementById('modal-details-body');

        function todayStr() {
            var d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function getViewDate() {
            return (viewDateEl && viewDateEl.value) ? viewDateEl.value : todayStr();
        }

        function renderRooms() {
            var dateStr = getViewDate();
            var todayStrVal = typeof getTodayManilaDateStr === 'function' ? getTodayManilaDateStr() : dateStr;
            roomsGrid.innerHTML = '';
            roomNames.forEach(function(name, i) {
                var roomId = String(i + 1);
                var occupied = typeof isRoomOccupiedOnDate === 'function' && isRoomOccupiedOnDate(ROOM_TYPE, roomId, dateStr);
                var label = occupied ? 'Occupied' : 'Available';
                if (occupied && typeof getScheduleForRoom === 'function' && typeof getRequestById === 'function') {
                    var entries = (dateStr === todayStrVal && typeof getActiveScheduleForRoom === 'function')
                        ? getActiveScheduleForRoom(ROOM_TYPE, roomId, dateStr)
                        : getScheduleForRoom(ROOM_TYPE, roomId, dateStr);
                    if (entries.length > 0) {
                        var req = getRequestById(entries[0].requestId);
                        label = req ? (req.activity || req.subject || 'Occupied') : 'Occupied';
                    }
                }
                var box = document.createElement('div');
                box.className = 'room-box ' + (occupied ? 'occupied' : 'available');
                box.setAttribute('data-room-id', roomId);
                box.innerHTML = '<span>' + name + '</span><span class="room-label">' + label + '</span>';
                box.onclick = function() {
                    openDetailsModal(roomId, name, dateStr);
                };
                roomsGrid.appendChild(box);
            });
        }

        function openDetailsModal(roomId, roomName, dateStr) {
            var entries = typeof getActiveScheduleForRoom === 'function' ? getActiveScheduleForRoom(ROOM_TYPE, roomId, dateStr) : [];
            modalDetailsTitle.textContent = roomName + ' — ' + (dateStr || getViewDate());
            if (entries.length === 0) {
                modalDetailsBody.innerHTML = '<p class="empty-msg">No schedule for this room on this date.</p>';
            } else {
                var html = '';
                entries.forEach(function(entry) {
                    var req = typeof getRequestById === 'function' ? getRequestById(entry.requestId) : null;
                    var experimentTitle = req ? (req.activity || req.subject || '—') : '—';
                    var professor = req ? (req.instructor || '—') : '—';
                    var studentName = req ? (req.studentName || '—') : '—';
                    html += '<div class="schedule-card">';
                    html += '<div class="detail-row"><span class="detail-label">Experiment / Activity</span><div class="detail-value">' + experimentTitle + '</div></div>';
                    html += '<div class="detail-row"><span class="detail-label">Professor / Instructor</span><div class="detail-value">' + professor + '</div></div>';
                    html += '<div class="detail-row"><span class="detail-label">Student (requested by)</span><div class="detail-value">' + studentName + '</div></div>';
                    html += '<div class="detail-row"><span class="detail-label">Start time</span><div class="detail-value">' + (entry.startTime || '—') + '</div></div>';
                    html += '<div class="detail-row"><span class="detail-label">End time</span><div class="detail-value">' + (entry.endTime || '—') + '</div></div>';
                    if (req && req.requestId) html += '<div class="detail-row"><span class="detail-label">Request ID</span><div class="detail-value">' + req.requestId + '</div></div>';
                    html += '</div>';
                });
                modalDetailsBody.innerHTML = html;
            }
            modalDetails.classList.add('open');
        }

        function closeDetails() {
            modalDetails.classList.remove('open');
        }

        if (viewDateEl) {
            viewDateEl.value = todayStr();
            viewDateEl.addEventListener('change', renderRooms);
        }
        document.getElementById('close-details').addEventListener('click', closeDetails);
        document.getElementById('close-details-btn').addEventListener('click', closeDetails);
        modalDetails.addEventListener('click', function(e) { if (e.target === modalDetails) closeDetails(); });

        renderRooms();
        setInterval(function() {
            if (typeof getViewDate === 'function' && typeof getTodayManilaDateStr === 'function' && getViewDate() === getTodayManilaDateStr()) {
                renderRooms();
            }
        }, 60000);
    })();
    </script>
    <script>(function(){function u(){var e=document.getElementById('sidebar-datetime');if(e)e.textContent=new Date().toLocaleString('en-PH',{timeZone:'Asia/Manila',weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});}u();setInterval(u,1000);})();</script>
